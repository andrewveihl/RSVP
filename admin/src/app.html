<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFAF7" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1A1A" />
		<!-- The admin panel must never be indexed, whatever a crawler finds. -->
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full bg-canvas text-ink antialiased">
		<div class="flex min-h-full flex-col">%sveltekit.body%</div>
	</body>
</html>
