# ---------------------------------------------------------------------------
# Two apps, two hostnames, one certificate.
#
# Guest site: andrew-madeline-rsvp.duckdns.org
# Admin:      andrew-madeline-rsvp-admin.duckdns.org
#
# Generated by `npm run set-domain`. Re-run that rather than editing by hand, so
# .env stays in step with this file.
#
# The admin hostname is a sibling of the guest one rather than a sub-subdomain of it
# (`admin.rsvp.…`): DuckDNS hands out one label, and a wildcard certificate would need
# a DNS-01 challenge. Two flat names share one certificate over plain HTTP-01.
#
# A note on headers: nginx's `add_header` does not inherit into any block that declares
# an `add_header` of its own, so every block that sets a header includes the *complete*
# header file for its app. Getting that wrong drops the CSP silently.
# ---------------------------------------------------------------------------

upstream wedding_app {
	server app:3000;
	keepalive 32;
}

upstream wedding_admin {
	server admin:3000;
	keepalive 16;
}

# --- HTTP: ACME challenges, everything else redirected to HTTPS -------------
server {
	listen 80;
	listen [::]:80;
	server_name andrew-madeline-rsvp.duckdns.org andrew-madeline-rsvp-admin.duckdns.org;

	# Certbot writes its challenge files into this shared volume.
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type "text/plain";
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

# --- HTTPS: the guest wedding site ------------------------------------------
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name andrew-madeline-rsvp.duckdns.org;

	ssl_certificate     /etc/letsencrypt/live/andrew-madeline-rsvp.duckdns.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/andrew-madeline-rsvp.duckdns.org/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;

	include /etc/nginx/conf.d/headers-guest.inc;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type "text/plain";
	}

	# A token lives in these URLs, so they must never reach a search engine, a link
	# preview or a shared cache. The app sets both of these headers as well; this is
	# the copy that survives if it ever stops.
	location /rsvp {
		proxy_pass http://wedding_app;
		include /etc/nginx/conf.d/proxy.inc;

		include /etc/nginx/conf.d/headers-guest.inc;
		add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
		add_header Cache-Control "no-store" always;
	}

	location / {
		proxy_pass http://wedding_app;
		include /etc/nginx/conf.d/proxy.inc;
	}
}

# --- HTTPS: the admin dashboard ---------------------------------------------
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name andrew-madeline-rsvp-admin.duckdns.org;

	# One certificate covers both names (see scripts/init-letsencrypt.sh), so the paths
	# below deliberately point at the primary domain's directory.
	ssl_certificate     /etc/letsencrypt/live/andrew-madeline-rsvp.duckdns.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/andrew-madeline-rsvp.duckdns.org/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;

	include /etc/nginx/conf.d/headers-admin.inc;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type "text/plain";
	}

	location / {
		proxy_pass http://wedding_admin;
		include /etc/nginx/conf.d/proxy.inc;
		include /etc/nginx/conf.d/headers-admin.inc;

		# Generating a two-hundred-page invitation PDF takes a moment.
		proxy_read_timeout  300s;
		proxy_send_timeout  300s;

		# Photo uploads. Must clear the app's 8MB per-image cap with room for the rest
		# of the multipart body, and match BODY_SIZE_LIMIT in docker-compose.yml.
		client_max_body_size 16m;
	}
}
