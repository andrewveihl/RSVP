user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
	worker_connections  1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	# Include the client IP so the apps' per-IP rate limiters and logs line up with
	# what nginx saw.
	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
	                '$status $body_bytes_sent "$http_referer" '
	                '"$http_user_agent" "$http_x_forwarded_for" '
	                'rt=$request_time urt=$upstream_response_time';

	access_log  /var/log/nginx/access.log main;

	sendfile        on;
	tcp_nopush      on;
	tcp_nodelay     on;
	keepalive_timeout  75s;
	types_hash_max_size 2048;

	# Do not advertise the exact nginx version.
	server_tokens off;

	# Nothing a guest sends is large. The admin uploads photos, and its own server
	# block raises this; the low default here is what keeps the guest site cheap to
	# flood.
	client_max_body_size 1m;
	client_body_buffer_size 128k;
	client_body_timeout 60s;
	client_header_timeout 60s;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_min_length 512;
	gzip_types
		text/plain
		text/css
		text/javascript
		application/javascript
		application/json
		application/xml
		image/svg+xml;

	gzip_disable "msie6";

	include /etc/nginx/conf.d/*.conf;
}
