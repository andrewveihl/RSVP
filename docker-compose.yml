services:
  # --- Guest wedding site: rsvp.<domain> ------------------------------------
  app:
    build:
      # Repo root, because both apps compile in the shared/ package.
      context: .
      dockerfile: app/Dockerfile
    image: wedding-rsvp-app
    container_name: wedding-rsvp-app
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_PATH: /data/wedding-rsvp.db
      # adapter-node rejects a larger body with a bare 413, before any of our code
      # runs. Nothing is uploaded to the guest site -- an RSVP is a handful of fields
      # -- so this stays small on purpose: it is the public-facing container.
      BODY_SIZE_LIMIT: 2M
      # adapter-node builds absolute URLs from ORIGIN when it sits behind a proxy.
      # Without it, redirects and origin checks would use the internal container host.
      ORIGIN: ${PUBLIC_SITE_URL}
      # Dates are rendered in local time -- set this to the wedding's zone so every
      # guest sees the same day, wherever they are reading from.
      TZ: ${TZ:-UTC}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COUPLE_NAMES: ${COUPLE_NAMES}
      WEDDING_DATE: ${WEDDING_DATE}
      RSVP_DEADLINE: ${RSVP_DEADLINE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      # THE database. Shared with the admin container; that is the only thing the two
      # have in common, which is what keeps them isolated from each other.
      - db-data:/data
    expose:
      - "3000"
    networks:
      - wedding
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --- Admin dashboard: rsvp-admin.<domain> ---------------------------------
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: wedding-rsvp-admin
    container_name: wedding-rsvp-admin
    restart: unless-stopped
    init: true
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_PATH: /data/wedding-rsvp.db
      # This is the one that was breaking photo uploads. adapter-node defaults to
      # 512K and answers anything larger with a bare 413 before the app sees it --
      # while the app itself advertises an 8MB limit per image, and the gallery
      # accepts several at once. Sized for a batch of those; the per-image cap in
      # `storeImage` is still what decides whether any one photo is acceptable.
      BODY_SIZE_LIMIT: 64M
      ORIGIN: ${PUBLIC_ADMIN_URL}
      TZ: ${TZ:-UTC}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COUPLE_NAMES: ${COUPLE_NAMES}
      WEDDING_DATE: ${WEDDING_DATE}
      RSVP_DEADLINE: ${RSVP_DEADLINE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - db-data:/data
    expose:
      - "3001"
    networks:
      - wedding
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# ---------------------------------------------------------------------------
volumes:
  db-data:
    name: wedding-rsvp-data

networks:
  wedding:
    name: wedding-rsvp
  proxy:
    external: true
