services:
  # --- Guest wedding site: rsvp.<domain> ------------------------------------
  app:
    build:
      # Repo root, because both apps compile in the shared/ package.
      context: .
      dockerfile: app/Dockerfile
    image: wedding-rsvp-app
    container_name: wedding-rsvp-app
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_PATH: /data/wedding-rsvp.db
      # adapter-node builds absolute URLs from ORIGIN when it sits behind a proxy.
      # Without it, redirects and origin checks would use the internal container host.
      ORIGIN: ${PUBLIC_SITE_URL}
      # Dates are rendered in local time -- set this to the wedding's zone so every
      # guest sees the same day, wherever they are reading from.
      TZ: ${TZ:-UTC}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COUPLE_NAMES: ${COUPLE_NAMES}
      WEDDING_DATE: ${WEDDING_DATE}
      RSVP_DEADLINE: ${RSVP_DEADLINE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      # THE database. Shared with the admin container; that is the only thing the two
      # have in common, which is what keeps them isolated from each other.
      - db-data:/data
    expose:
      - "3000"
    networks:
      - wedding
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --- Admin dashboard: rsvp-admin.<domain> ---------------------------------
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: wedding-rsvp-admin
    container_name: wedding-rsvp-admin
    restart: unless-stopped
    init: true
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_PATH: /data/wedding-rsvp.db
      ORIGIN: ${PUBLIC_ADMIN_URL}
      TZ: ${TZ:-UTC}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COUPLE_NAMES: ${COUPLE_NAMES}
      WEDDING_DATE: ${WEDDING_DATE}
      RSVP_DEADLINE: ${RSVP_DEADLINE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - db-data:/data
    expose:
      - "3001"
    networks:
      - wedding
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --- Reverse proxy --------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: wedding-rsvp-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
    expose:
      - "80"
    networks:
      - wedding
      - proxy
    depends_on:
      - app
      - admin
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # --- TLS certificate renewal (Let's Encrypt) ------------------------------
  certbot:
    image: certbot/certbot
    container_name: wedding-rsvp-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >-
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'
    networks:
      - wedding

# ---------------------------------------------------------------------------
volumes:
  db-data:
    name: wedding-rsvp-data
  certbot-webroot:
    name: wedding-rsvp-certbot-webroot
  certbot-conf:
    name: wedding-rsvp-certbot-conf

networks:
  wedding:
    name: wedding-rsvp
  proxy:
    external: true
